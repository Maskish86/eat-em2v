# @package _group_

common:
  fp16: false
  bf16: true
  log_format: json
  log_interval: 1000
  user_dir: ${env:DATA_ROOT}/eat-em2v/baselines
  seed: 42

checkpoint:
  save_interval: 5
  no_epoch_checkpoints: false

task:
  _name: mae_image_pretraining
  data: ${env:DATA_ROOT}/manifests/pretrain
  rebuild_batches: true
  key: source
  precompute_mask_config: {}
  downsr_16hz: true
  audio_mae: true
  h5_format: false
  target_length: 1024
  flexible_mask: false
  wandb_project: emotion2vec-eat
  wandb_run_name: eat-ser-pretrain
  wandb_group: eat-ser-pretrain-seed42
  wandb_job_type: pretrain
  wandb_enable: true

dataset:
  num_workers: 10
  batch_size: 64
  skip_invalid_size_inputs_valid_test: true
  required_batch_size_multiple: 1
  disable_validation: true
  valid_subset: train

distributed_training:
  distributed_world_size: 1
  ddp_backend: c10d

criterion:
  _name: model
  log_keys:
    - ema_decay
    - target_var
    - pred_var
    - model_norm
    - ema_norm
    - masked_pct
    - dino_center_norm
    - dino_center_std
    - dino_teacher_entropy
    - dino_active_prototypes
    - prosody_r2_model
    - prosody_r2_interp
    - prosody_target_var
    - prosody_frac_cols
    # drift guard: fraction of utterances with detected padding. A sustained 0
    # means prosody_denorm_mean/std no longer match the dataset's normalization
    # and padded frames are contaminating the target -- silently.
    - prosody_frac_padded
    # fraction of ranks that had something to score on a diagnostic step. The
    # r2 gap is compressed by (N-k)/N with k empty ranks, so the true gap is
    # (r2_model - r2_interp) / prosody_diag_frac. Without this key that
    # correction is unobtainable and the gap reads biased toward "trivial".
    - prosody_diag_frac

optimization:
  max_update: 150_000
  lr: [ 1e-4 ]
  max_epoch: 20
  clip_norm: 4

optimizer:
  _name: composite
  groups:
    default:
      lr_float: 1e-4
      optimizer:
        _name: adam
        adam_betas: [0.9, 0.95]
        weight_decay: 1e-2
      lr_scheduler:
        _name: cosine
        warmup_updates: 20_000  # scale to dataset size
        min_lr: 1e-5

lr_scheduler: pass_through

model:
  _name: data2vec_multi

  ema_decay: 0.9998
  ema_end_decay: 0.99999
  ema_anneal_end_step: 100_000
  instance_norm_target_layer: true
  layer_norm_target_layer: false
  layer_norm_targets: true
  end_of_block_targets: false

  depth: 12
  average_top_k_layers: 12
  clone_batch: 16

  norm_eps: 1e-6
  layer_decay: 0.65
  no_decay_blocks: true

  min_target_var: 0
  min_pred_var: 0

  encoder_dropout: 0
  post_mlp_drop: 0
  attention_dropout: 0
  activation_dropout: 0

  supported_modality: IMAGE
  cls_loss: 3
  recon_loss: 1
  d2v_loss: 0

  # emotion-correlated prosody target. 0 = disabled (existing path untouched).
  # 1.0 is parity with recon=1; the dim-parity factor is applied in the model.
  prosody_loss: 1.0

  # corpus, not instance -- measured, not preferred. Contour probe held at 192
  # dims with normalisation the only variable: corpus 48.69 WA / 47.78 UA vs
  # instance 40.06 / 38.27. Deleting absolute level costs 8.63 WA, 62% of the
  # summary-vs-contour gap. See plan/preflight-results.md.
  #
  # lambda does NOT transfer between modes -- re-sweep if this ever changes.
  prosody_norm: corpus

  # From scripts/compute_prosody_corpus_stats.py over the pretraining manifest
  # (manifests/pretrain/train.tsv): 185,392 utterances, 5,756,053 valid patches
  # = 255.8 h, i.e. 97.6% of the ~262 h corpus -- the shortfall is what
  # floor(n_frames/16) and min_sample_size discard. Constants in
  # $DATA_ROOT/prosody_corpus_stats.json with the manifest and commit recorded.
  #
  # These are CORPUS-SPECIFIC: recompute if the pretraining data changes, or the
  # target is scaled against the wrong distribution with nothing to reveal it.
  # Order matches DESCRIPTORS = [log_energy, centroid, flux].
  #
  # Normalisation is not optional. Raw stds are 3.27 / 20.33 / 2.76, so centroid
  # (a mel-BIN INDEX, 0-127) would command ~96% of the MSE and the other two
  # would go effectively unlearned -- while the ablation says log_energy is the
  # one that matters (-5.28 WA when removed) and centroid the least (+0.38).
  prosody_corpus_mean: [0.2880, 64.3173, 15.0033]
  prosody_corpus_std: [3.2706, 20.3331, 2.7568]

  use_dino_head: true
  dino_out_dim: 4096
  dino_nlayers: 3
  dino_hidden_dim: 2048
  dino_bottleneck_dim: 256
  dino_teacher_temp: 0.04
  dino_teacher_temp_warmup_init: 0.07
  dino_teacher_temp_warmup_steps: 15000
  dino_center_momentum: 0.9
  softmax_temperature_student: 0.1

  ema_encoder_only: false

  modalities:
    image:
      in_chans: 1
      inverse_mask: true
      mask_prob: 0.8
      mask_prob_adjust: 0.07
      mask_length: 5
      mask_noise_std: 0.01
      prenet_depth: 0
      ema_local_encoder: true
      num_extra_tokens: 1
      init_extra_token_zero: false
      use_alibi_encoder: false
      decoder:
        decoder_dim: 768
        decoder_groups: 16
        decoder_kernel: 3
        decoder_layers: 6
        input_dropout: 0
